[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superinfer"
version = "0.1.0"
description = "Control-plane tooling for the SuperInfer inference compiler"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]
model = ["torch", "transformers", "safetensors"]
gpu = ["nvidia-cuda-runtime-cu12"]

[project.scripts]
superinfer = "superinfer.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["superinfer"]

